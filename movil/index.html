<style id=orus-css>

 --o-fill:rgba(118,118,128,.24);--o-bar:rgba(22,22,24,.82);--o-sw:#39393d;--o-swon:#30d158;--o-ind:#5e5ce6;--acc2:rgba(10,132,255,.18);--emp:#48484a;color-scheme:dark}}

table.hres,table.hres tbody,table.hres td{display:block}

 padding:11px 16px;border-bottom:.5px solid var(--o-sep);align-items:baseline}
table.hres tr:last-child{border-bottom:0}
table.hres td{border:0;padding:0!important;max-width:none!important;font-size:13px!important;color:var(--o-sec)}

.si{color:var(--o-ok)}
.no{color:var(--o-bad)}
.gad summary{color:var(--o-sec)}

.o-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
 padding:6px max(8px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));

.cab{position:relative}

.o-act svg{width:19px;height:19px}
p.o-res{margin:8px 0 0;background:var(--o-card);border-radius:12px;padding:10px 14px;font-size:15px;color:var(--o-txt)}
p.o-res b{color:var(--o-ok)}
h2 .o-sub{display:block;font:400 15px var(--f-txt);color:var(--o-sec);letter-spacing:0;margin-top:1px}
h2{flex-wrap:wrap}
h2:has(.o-sub){display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px}
h2:has(.o-sub) .o-sub{grid-column:1;grid-row:2}

.o-ins{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.o-ins .cfb,.o-ins .fza{margin:0}
table.t td[data-l]{font-size:15px}
#v-hist>p.meta{display:none}
table.rank tr.par{grid-template-columns:repeat(6,minmax(0,1fr))}
table.rank td.hora{grid-column:1/4}

table.t td.n[data-l]{font:600 22px/1.2 var(--f-tit);font-variant-numeric:tabular-nums}

/* niveles: rivales por nivel y comparador */

.nvb{font-size:13px;line-height:1.5}
.nvb .nvh{font-size:14px}.nvb .nvh b{font-family:var(--f-txt);font-weight:600}
.nvb .dg>div{background:var(--o-fill);border-radius:10px;padding:8px 10px}

<script>
/* Orus: version para el celular de la pagina del motor (../). Trae la pagina del motor, la muestra con estilo iOS y
   esconde las explicaciones largas. No cambia datos ni predicciones: es la misma pagina, solo se ve distinto. */
// Orus: arma la vista del celular sobre la pagina del motor (despues de que corre su propio script).
function orus(){
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const guarda = (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} }, lee = k => { try { return localStorage.getItem(k) } catch (e) { return null } };
  // encabezado: Orus, cuando se actualizo, y el estado del motor plegado
  const cab = $('header.cab'), metas = cab ? $$('.meta', cab) : [];
  if (cab) {
    const h1 = $('h1', cab); if (h1) h1.textContent = 'Orus';
    const act = document.createElement('button'); act.type = 'button'; act.className = 'o-act'; act.setAttribute('aria-label', 'Actualizar');
    act.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4.5V11h-6.5"/></svg>';
    act.onclick = () => location.reload(); cab.append(act);
    const m0 = metas[0];
    if (m0) { const t = m0.textContent, a = t.match(/Actualizado (\d\d)-(\d\d)-\d{4} (\d\d:\d\d)/), n = t.match(/(\d+) partidos/);
      if (a) m0.textContent = 'Actualizado ' + a[1] + '-' + a[2] + ' a las ' + a[3] + (n ? ' · ' + n[1] + ' partidos' : ''); }
    for (const m of metas.slice(1)) if (!m.classList.contains('rend')) m.classList.add('o-oculto');
    const rend = $('.rend', cab);
    if (rend) { const d = document.createElement('details'); d.className = 'o-estado';
      d.innerHTML = '<summary>Cómo va el motor</summary>'; cab.after(d); d.append(rend); }
  }
  // explicaciones: escondidas, con un boton (i) al lado del titulo
  for (const p of $$('p.nota')) { const h = p.previousElementSibling;
    if (h && h.tagName === 'H2') { const b = document.createElement('button'); b.className = 'o-info'; b.type = 'button'; b.textContent = 'i';
      b.setAttribute('aria-label', 'Cómo se lee'); b.onclick = () => p.classList.toggle('o-ver'); h.append(b); } }
  // titulos: lo que va despues del primer '·' queda como subtitulo pequeno
  for (const h of $$('h2')) { const t = h.firstChild;
    if (t && t.nodeType === 3 && t.nodeValue.includes('\u00b7')) { const [a, ...r] = t.nodeValue.split('\u00b7');
      t.nodeValue = a.trim(); const s = document.createElement('span'); s.className = 'o-sub'; s.textContent = r.map(x => x.trim()).join(' \u00b7 '); h.append(s); } }
  // insignias (Fuerte / Confirmada) junto al pronostico; celdas vacias fuera
  for (const tr of $$('table.t tr.par')) { const pk = $('.pick', tr), bs = $$('td.hist > .fza, td.hist > .cfb', tr);
    if (pk && bs.length) { const d = document.createElement('div'); d.className = 'o-ins'; d.append(...bs); pk.append(d); }
    for (const td of tr.cells) if ((td.dataset.l || td.classList.contains('hist')) && !td.textContent.trim()) td.classList.add('o-oculto'); }
  // listas (cuotas, goleadores, confirmadas): numeros en una fila con su etiqueta
  for (const t of $$('table.rank')) { const th = $$('thead th', t).map(x => x.textContent.trim()), f = $('tbody tr.par', t);
    if (!f) continue; t.classList.add('o-n' + $$('td.n', f).length);
    for (const tr of $$('tbody tr.par', t)) [...tr.cells].forEach((td, i) => {
      if (i < 4 || td.classList.contains('hist')) return;
      if (!td.className) td.classList.add('o-full');
      if (!td.dataset.l && th[i]) { td.dataset.l = th[i];
        for (const m of $$('.mk', td)) if (m.textContent.trim().toLowerCase() === th[i].toLowerCase()) m.remove(); } }); }
  // de la explicacion de 'Confirmadas 1.30' solo queda el balance
  for (const h of $$('h2')) if (/^Confirmadas/.test(h.textContent)) { const p = h.nextElementSibling;
    if (p && p.classList.contains('nota')) { const m = p.innerHTML.match(/(\d+ de \d+ acertadas[\s\S]*)$/);
      if (m) { const r = document.createElement('p'); r.className = 'o-res'; r.innerHTML = m[1]; p.after(r); } } }
  // cuota minima como control segmentado y 'solo confirmadas' como interruptor
  for (const tabs of $$('.tabs')) { const mns = $$('.mn', tabs); if (!mns.length) continue;
    const seg = document.createElement('div'); seg.className = 'o-seg'; tabs.before(seg);
    for (const b of mns) { b.textContent = (b.dataset.m || b.textContent) + '+'; seg.append(b); } }
  const cfo = $('.cfo'); if (cfo) { cfo.textContent = 'Solo confirmadas'; const s = document.createElement('span'); s.className = 'o-sw'; s.innerHTML = '<i></i>'; cfo.append(s); }
  // secciones y barra de pestanas
  const prox = $('#v-prox'), hist = $('#v-hist'), secs = {};
  if (prox) { let cur = null;
    for (const el of [...prox.children]) {
      if (el.tagName === 'H2') { const t = el.textContent; const k = /cuota/i.test(t) ? 'cuotas' : /marca o asiste/i.test(t) ? 'goles' : /todos/i.test(t) ? 'partidos' : 'otros' + Object.keys(secs).length;
        cur = secs[k] = document.createElement('section'); cur.className = 'o-sec'; cur.dataset.k = k; el.before(cur); }
      if (cur) cur.append(el); } }
  const ico = {
    cuotas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h13A1.5 1.5 0 0 1 20 7.5v2a2.5 2.5 0 0 0 0 5v2a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 16.5v-2a2.5 2.5 0 0 0 0-5z"/><path d="M9.5 12.2l1.8 1.8 3.4-3.6"/></svg>',
    goles: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>',
    partidos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5l3.3 2.4-1.3 3.9h-4l-1.3-3.9z"/><path d="M12 3.5v4M15.3 9.9l4.1-1.4M14 13.8l2.6 3.6M10 13.8l-2.6 3.6M8.7 9.9L4.6 8.5"/></svg>',
    historial: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    comparar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20v-7M12 20V5M18 20v-10"/></svg>' };
  const nombres = { cuotas: 'Cuotas', goles: 'Goleadores', partidos: 'Partidos', historial: 'Historial', comparar: 'Comparar' };
  const claves = Object.keys(secs).filter(k => nombres[k]).concat(hist ? ['historial'] : []).concat($('#v-comp') ? ['comparar'] : []);
  const bar = document.createElement('nav'); bar.className = 'o-tabbar';
  const vb = v => { const b = $('.vb[data-v="' + v + '"]'); if (b) b.click(); };
  function ir(k, arriba) {
    if (k === 'historial') vb('hist'); else if (k === 'comparar') vb('comp'); else { vb('prox'); for (const [kk, s] of Object.entries(secs)) s.hidden = kk !== k; }
    for (const b of $$('button', bar)) b.classList.toggle('on', b.dataset.k === k);
    guarda('orus_pestana', k); if (arriba) window.scrollTo(0, 0); }
  for (const k of claves) { const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.innerHTML = ico[k] + nombres[k]; b.onclick = () => ir(k, true); bar.append(b); }
  document.body.append(bar);
  const g = lee('orus_pestana'); ir(claves.includes(g) ? g : claves[0], false);
}

// Pagina ligera (24-nov): el historial y el detalle de cada partido llegan despues (al abrirlos). Cuando llegan,
// la pagina avisa con 'motor:cargado' y aqui se les da el mismo formato que al resto.
function orusFmt(R) {
  if (!R || !R.querySelectorAll) return;
  const $ = (s, r = R) => r.querySelector(s), $$ = (s, r = R) => [...r.querySelectorAll(s)];
  for (const p of $$('p.nota')) { const h = p.previousElementSibling;
    if (h && h.tagName === 'H2' && !h.querySelector('.o-info')) { const b = document.createElement('button'); b.className = 'o-info'; b.type = 'button'; b.textContent = 'i';
      b.setAttribute('aria-label', 'Cómo se lee'); b.onclick = () => p.classList.toggle('o-ver'); h.append(b); } }
  for (const h of $$('h2')) { const t = h.firstChild;
    if (t && t.nodeType === 3 && t.nodeValue.includes('·')) { const [a, ...r] = t.nodeValue.split('·');
      t.nodeValue = a.trim(); const s = document.createElement('span'); s.className = 'o-sub'; s.textContent = r.map(x => x.trim()).join(' · '); h.append(s); } }
  for (const tr of $$('table.t tr.par')) { const pk = $('.pick', tr), bs = $$('td.hist > .fza, td.hist > .cfb', tr);
    if (pk && bs.length) { const d = document.createElement('div'); d.className = 'o-ins'; d.append(...bs); pk.append(d); }
    for (const td of tr.cells) if ((td.dataset.l || td.classList.contains('hist')) && !td.textContent.trim()) td.classList.add('o-oculto'); }
  for (const t of $$('table.rank')) { const th = $$('thead th', t).map(x => x.textContent.trim()), f = $('tbody tr.par', t);
    if (!f) continue; t.classList.add('o-n' + $$('td.n', f).length);
    for (const tr of $$('tbody tr.par', t)) [...tr.cells].forEach((td, i) => {
      if (i < 4 || td.classList.contains('hist')) return;
      if (!td.className) td.classList.add('o-full');
      if (!td.dataset.l && th[i]) { td.dataset.l = th[i];
        for (const m of $$('.mk', td)) if (m.textContent.trim().toLowerCase() === th[i].toLowerCase()) m.remove(); } }); }
  for (const h of $$('h2')) if (/^Confirmadas/.test(h.textContent) && !(h.nextElementSibling && h.nextElementSibling.nextElementSibling && h.nextElementSibling.nextElementSibling.classList.contains('o-res'))) {
    const p = h.nextElementSibling;
    if (p && p.classList.contains('nota')) { const m = p.innerHTML.match(/(\d+ de \d+ acertadas[\s\S]*)$/);
      if (m) { const r = document.createElement('p'); r.className = 'o-res'; r.innerHTML = m[1]; p.after(r); } } }
}
document.addEventListener('motor:cargado', e => { try { orusFmt(e.detail) } catch (x) { console.error('orus', x) } });

(async function cargar() {
  const caja = document.getElementById('o-carga');
  try {
    const r = await fetch('../', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const t = await r.text(), ini = t.indexOf('<body'), fin = t.lastIndexOf('</body>');
    if (ini < 0 || fin < 0 || !/id=['"]?v-prox/.test(t)) throw new Error('la página del motor no llegó completa');
    const estilos = [...t.slice(0, ini).matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)].map(m => m[1]).join('\n');
    const codigos = [], cuerpo = t.slice(t.indexOf('>', ini) + 1, fin).replace(/<script[^>]*>([\s\S]*?)<\/script>/gi, (m, c) => { codigos.push(c); return ''; });
    const st = document.createElement('style'); st.textContent = estilos; document.head.insertBefore(st, document.getElementById('orus-css'));
    document.body.innerHTML = cuerpo;
    for (const c of codigos) { try { new Function(c)(); } catch (e) { console.error(e); } }
    try { orus(); } catch (e) { console.error('orus', e); }
    let oculto = 0;
    document.addEventListener('visibilitychange', () => { if (document.hidden) oculto = Date.now(); else if (oculto && Date.now() - oculto > 30 * 60e3) location.reload(); });
  } catch (e) {
    caja.innerHTML = '<div>No se pudo cargar la página del motor.<br><small>' + String(e.message || e).replace(/</g, '&lt;') + '</small></div><button type=button onclick="location.reload()">Reintentar</button>';
  }
})();
